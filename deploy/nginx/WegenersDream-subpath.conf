# Wegener's Dream 을 80 포트의 /WegenersDream/ 아래에 얹는다. GSM-subpath.conf 를 본떴다.
#
# 사내 VPN 이 80 만 통과시키고, 이 머신의 80 은 phyloserver 블록이 잡고 있다.
# 그래서 서브경로로 얹는다.
#
# 설치:
#   sudo cp deploy/nginx/WegenersDream-subpath.conf /etc/nginx/snippets/WegenersDream-subpath.conf
#   # /etc/nginx/sites-enabled/phyloserver 의 server 블록 안에 한 줄:
#   #     include snippets/WegenersDream-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx

location = /WegenersDream {
    return 301 /WegenersDream/;
}

# 소문자로 친 주소를 정식 주소로. 아래 /WegenersDream/ 블록의 `^~` 가 없으면 무한 루프가 된다.
location ~* ^/(wegenersdream)(/.*)?$ {
    return 301 /WegenersDream$2;
}

location ^~ /WegenersDream/ {
    # 끝에 슬래시를 붙이지 않는다 — Django 가 처음부터 /WegenersDream/ 에 붙어 있다(WEGENER_URL_PREFIX).
    proxy_pass http://127.0.0.1:8095;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 정적 파일은 오래 들고 있어도 된다. map.js·map.css 는 템플릿이 ?v=<판> 을 붙인다.
location ^~ /WegenersDream/static/ {
    proxy_pass http://127.0.0.1:8095;
    proxy_set_header Host $http_host;
    expires 7d;
    add_header Cache-Control "public";
}
