# 굽는 쪽(개발 장비). 운영은 deploy/srv/docker-compose.yml 로 돈다.
#
#   WEGENER_TAG=v0.1.0 docker compose -f deploy/docker-compose.yml build web
#   WEGENER_TAG=v0.1.0 docker compose -f deploy/docker-compose.yml push web

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: koprifossillab/wegenersdream:${WEGENER_TAG:-dev}
